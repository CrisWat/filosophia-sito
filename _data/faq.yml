- domanda: "Devo prenotare?"
  risposta: "Sì. Ogni appuntamento è dedicato a una sola persona e comincia dall'analisi della pelle: per questo l'agenda è a slot, non a passaggio libero."

- domanda: "La prima volta cosa succede?"
  risposta: "Il primo incontro è di analisi e consulenza. Si legge la pelle, si ascolta la tua storia e si costruisce insieme il percorso. Nessun trattamento viene proposto prima di aver capito."

- domanda: "Filosophia è un centro medico?"
  risposta: "No. Filosophia è un'attività di estetista con vendita di prodotti cosmetici. Non si effettuano prestazioni mediche né si formulano diagnosi: l'analisi della pelle è una valutazione estetica."

- domanda: "Quando partono i trattamenti in cabina?"
  risposta: "Prossimamente. Dall'apertura si comincia con l'analisi della pelle e la consulenza; i trattamenti in cabina e i percorsi verranno annunciati su Instagram."

- domanda: "Posso comprare solo i prodotti?"
  risposta: "Certo. La consulenza al banco è gratuita e resta il modo migliore per non comprare la cosa sbagliata."

- domanda: "Quanto dura un percorso?"
  risposta: "La pelle si rinnova in circa 28 giorni: i primi segnali si vedono in 4–6 settimane, i risultati strutturali in tre mesi. Per questo i percorsi partono da 3 mesi."

- domanda: "Ci sono carte regalo?"
  risposta: "Sì, in negozio dall'apertura. Le carte regalo per trattamenti e percorsi arriveranno insieme ai trattamenti in cabina."
