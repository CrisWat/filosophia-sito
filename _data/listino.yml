linee:
  - id: azra
    nome: "Azra Botanical Simplicity"
    breve: "Azra"
    origine: "L'Aia, Paesi Bassi"
    routine: "La routine Azra, in quattro passi"
    testo: "Pochi ingredienti, massima efficacia. La fondatrice, la skin therapist Azra Secerbegovic, unisce la precisione della cosmesi clinica a estratti botanici scelti con rigore: formule essenziali, rispettose della barriera cutanea. Una routine completa in nove gesti."
    gruppi:
      - nome: "Detergere"
        id: "azra-detergere"
        passo: 1
        descrizione: "Il primo gesto, mattina e sera: la doppia detersione."
        prodotti:
          - nome: "All Clean Balm"
            nota: "Balsamo struccante"
            formato: "100 ml"
            prezzo: "42,00"
            descrizione: "Scioglie trucco, filtri solari e impurità, poi si emulsiona in un latte che si risciacqua. Lasciato in posa diventa una delicata maschera enzimatica che leviga e illumina."
            attivi: ["fermento di papaya", "oli di borragine, canapa e jojoba", "tanaceto blu"]
            uso: "Su pelle asciutta come primo detergente; una volta a settimana in posa 10–15 minuti."
          - nome: "Soothing Cleansing Gel"
            nota: "Gel detergente"
            formato: "100 ml"
            prezzo: "42,00"
            descrizione: "Gel non schiumogeno dal pH bilanciato: purifica senza alterare la barriera cutanea e lascia la pelle fresca e idratata. Adatto anche alle pelli sensibili."
            attivi: ["aloe vera", "camomilla romana", "olio di vinacciolo"]
            uso: "Mattina e sera, secondo passaggio della doppia detersione."
      - nome: "Preparare e trattare"
        id: "azra-preparare-e-trattare"
        passo: 2
        descrizione: "Tonico e sieri: gli attivi, nella concentrazione giusta."
        prodotti:
          - nome: "Deep Hydration 3-in-1"
            nota: "Tonico, siero e bruma"
            formato: "100 ml"
            prezzo: "48,00"
            descrizione: "Ripristina il pH dopo la detersione e dona un'idratazione leggera e duratura. Lenisce e uniforma il tono senza appesantire: pensato per pelli sensibili, disidratate o reattive."
            attivi: ["niacinamide", "acido ialuronico", "pantenolo"]
            uso: "Dopo la detersione, 3–4 spruzzi; durante il giorno come bruma."
          - nome: "Intensive Serum"
            nota: "Siero idratante uniformante"
            formato: "50 ml"
            prezzo: "58,00"
            descrizione: "Rafforza la barriera cutanea e attenua macchie e rossori lasciati dalle imperfezioni. Texture setosa e non grassa, ottima anche come base trucco."
            attivi: ["niacinamide", "liquirizia", "ectoina", "olio di semi di lampone"]
            uso: "Mattina e sera, 1–2 pressioni su pelle detersa."
          - nome: "Super Glow Serum"
            nota: "Siero vitamina C e peptidi"
            formato: "50 ml"
            prezzo: "58,00"
            descrizione: "Ravviva l'incarnato spento e ne uniforma il tono; aiuta compattezza ed elasticità e leviga le linee sottili. Particolarmente indicato per pelli secche e mature."
            attivi: ["vitamina C stabile", "peptidi", "liquirizia"]
            uso: "Al mattino, 2–3 volte a settimana, sempre seguito da SPF."
      - nome: "Nutrire e proteggere"
        id: "azra-nutrire-e-proteggere"
        passo: 3
        descrizione: "Il sostegno quotidiano della barriera, e lo schermo dal sole."
        prodotti:
          - nome: "Daily Support Oil"
            nota: "Olio viso al bakuchiol"
            formato: "50 ml"
            prezzo: "58,00"
            descrizione: "Olio leggero e non comedogenico che nutre e sostiene la barriera cutanea. Calma i rossori e nel tempo favorisce tono ed elasticità; adatto anche a pelli sensibili o a tendenza acneica."
            attivi: ["bakuchiol", "vitamina A (retinyl palmitate)", "rosa mosqueta"]
            uso: "2–4 gocce scaldate tra i palmi, dopo il siero."
          - nome: "Day & Night Cream"
            nota: "Crema viso ai peptidi"
            formato: "50 ml"
            prezzo: "56,00"
            descrizione: "Crema versatile, per il giorno, la notte e anche il contorno occhi. Idrata, protegge la barriera e dona un aspetto più disteso. A rapido assorbimento, per ogni tipo di pelle."
            attivi: ["peptidi", "ceramidi", "centella asiatica", "acido ialuronico"]
            uso: "Mattina e sera, una pressione su pelle leggermente umida."
          - nome: "Sunscreen SPF50+ & Daily Cream"
            nota: "Protezione solare viso"
            formato: "50 ml"
            prezzo: "59,00"
            descrizione: "Protezione ad ampio spettro UVA/UVB che fa anche da idratante quotidiano, in una texture molto leggera. Arricchita di antiossidanti contro l'invecchiamento precoce."
            attivi: ["filtri UVA/UVB SPF50+", "tè verde", "coenzima Q10"]
            uso: "Ogni mattina, ultimo passaggio prima del trucco."
      - nome: "La pausa"
        id: "azra-la-pausa"
        passo: 4
        descrizione: "Un trattamento in più, quando la pelle lo chiede."
        prodotti:
          - nome: "Face Mask"
            nota: "Maschera idratante lenitiva"
            formato: "100 ml"
            prezzo: "58,00"
            descrizione: "Maschera cremosa che lenisce, rimpolpa e aiuta a ristabilire la barriera cutanea. Si usa in posa breve, come trattamento notturno o come siero leggero; ideale dopo i trattamenti in cabina."
            attivi: ["fermento marino", "alghe rosse", "niacinamide", "avena"]
            uso: "1–2 volte a settimana, in posa 10–25 minuti o per tutta la notte."
