- numero: "01"
  titolo: "Fermarsi"
  testo: "Il primo gesto è togliere: telefono, orologio, la lista delle cose da fare."

- numero: "02"
  titolo: "Comprendersi"
  testo: "La pelle racconta come stai. Leggerla è un modo indiretto di ascoltarti."

- numero: "03"
  titolo: "Abbracciarsi"
  testo: "Non correggere un difetto: riconoscere una forma."

- numero: "04"
  titolo: "Irradiare"
  testo: "Chi sta bene con sé lo porta fuori. La bellezza non è il traguardo: è la spinta."
