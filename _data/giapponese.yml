# Concetti reali della cultura giapponese del rituale.
# Usali con rispetto: il sito dichiara apertamente che è un prestito.

- kanji: "間"
  romaji: "Ma"
  significato: "L'intervallo"
  testo: "Il tempo vuoto non è tempo perso: è quello che dà valore al resto."

- kanji: "一期一会"
  romaji: "Ichigo ichie"
  significato: "Un incontro, una volta sola"
  testo: "Dalla cerimonia del tè: questo momento non si ripeterà identico. Un appuntamento per volta."

- kanji: "型"
  romaji: "Kata"
  significato: "La forma"
  testo: "Pochi gesti, sempre gli stessi, ripetuti finché diventano tuoi."

- kanji: "改善"
  romaji: "Kaizen"
  significato: "Il miglioramento minimo"
  testo: "Non la trasformazione: il grado in più, ogni volta."
