<!doctype html>
<html lang="{{ site.lang | default: 'it-IT' }}">

<head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#FAF7F2">

    <script>document.documentElement.className += " js";</script>

    {% seo %}
    <link rel="icon" type="image/png" href="{{ '/assets/images/favicon.png' | relative_url }}">
    <link rel="apple-touch-icon" href="{{ '/assets/images/apple-touch-icon.png' | relative_url }}">
    <link rel="preload" href="{{ '/assets/fonts/cormorant-garamond-latin-500-normal.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="{{ '/assets/fonts/jost-latin-300-normal.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>

    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v={{ site.time | date: '%Y%m%d%H%M' }}">

</head>

<body>

    <a class="skip-link" href="#main-content">Salta al contenuto</a>

    {% include header.html %}

    <main id="main-content">
        {{ content }}
    </main>

    {% include footer.html %}

    <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
    <script src="{{ '/assets/js/filo.js' | relative_url }}" defer></script>

</body>

</html>
